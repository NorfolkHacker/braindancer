name: Bug report
description: Something in ACID FM doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Ideas are welcome too: open a blank issue with "idea" in the title. This is ACID FM (a fork of JIANT FM, based on Felucca): report here, not to JIANT or Felucca.
  - type: input
    id: version
    attributes:
      label: ACID FM version
      description: Hold HOME > ABOUT on the FM-1
      placeholder: "v0.2"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
